<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="referrer" content="no-referrer"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'"><title>__PAGE_TITLE__ · Capability Map</title>
<style>
:root{color-scheme:dark;--bg:#0c1420;--panel:#111e2e;--line:#293b50;--ink:#e4edf8;--muted:#96abc3;--accent:#78d8c8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:#1b2c40;padding:7px 12px}button:hover,button.active{background:#254d53;border-color:var(--accent)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header{padding:17px 24px;border-bottom:1px solid var(--line);display:flex;gap:20px;justify-content:space-between;align-items:center}header strong{font-size:20px}header small{color:var(--accent);margin-left:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:9px 24px;color:#d4bc8b;font-size:12px;border-bottom:1px solid var(--line)}main{display:grid;grid-template-columns:205px minmax(0,1fr) 370px;height:calc(100vh - 119px);min-height:530px}nav{border-right:1px solid var(--line);padding:20px 13px;overflow:auto;background:var(--panel)}nav button{display:block;width:100%;margin:7px 0;text-align:left;font-size:12px}nav h3{font-size:10px;letter-spacing:2px;color:var(--muted);padding:0 9px}nav p{font-size:11px;color:var(--muted);margin:22px 9px}section{min-width:0;display:flex;flex-direction:column}.heading{padding:20px 24px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:24px;letter-spacing:-.7px}.summary{font-size:12px;color:var(--muted);margin:6px 0 15px}.controls{display:flex;gap:7px;flex-wrap:wrap;align-items:center}input,select{background:#0a1421;border:1px solid var(--line);border-radius:6px;padding:6px 9px;max-width:100%}.search{flex:1;min-width:150px}.canvas{background-image:radial-gradient(#28384c 1px,transparent 1px);background-size:22px 22px;flex:1;min-height:260px;overflow:auto}.canvas svg{display:block;min-width:100%;min-height:100%}.legend{padding:9px 20px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}aside{padding:23px;overflow:auto;background:var(--panel);border-left:1px solid var(--line)}aside h2{font-size:22px;margin:8px 0}aside h3{font-size:12px;color:var(--accent);margin:22px 0 6px}.badge{display:inline-block;padding:2px 7px;border:1px solid #5d5136;border-radius:5px;font-size:10px;color:#dac28d}.detail{font-size:12px;color:#c6d5e6;white-space:pre-wrap;overflow-wrap:anywhere}.rule{padding:12px;border:1px solid var(--line);border-radius:8px;background:#13253a;margin:10px 0}.rule strong{font-size:12px}.rule p{font-size:12px;margin:7px 0;color:#cad8e7;white-space:pre-wrap}.rule small{color:var(--muted);font-size:10px}.unknown{border-left:2px solid #bf985a;padding:7px 11px;font-size:12px;color:#d4bd91;background:#2b2722;margin:8px 0}.node{cursor:pointer}.node rect{fill:#15263a;stroke:#3e5872;stroke-width:1.3}.node:hover rect,.node.selected rect{fill:#1d4249;stroke:var(--accent);stroke-width:2}.node.impact rect{stroke:#d6b376;stroke-width:2}.node text{fill:var(--ink);font-size:13px;pointer-events:none}.node .sub{fill:var(--muted);font-size:10px}.edge{fill:none;stroke:#6c8ba7;stroke-width:1.5;opacity:.7}.hit{fill:none;stroke:transparent;stroke-width:14;cursor:pointer}.edge-label{fill:#b6cada;font-size:10px;paint-order:stroke;stroke:var(--bg);stroke-width:4px}.muted{color:var(--muted);font-size:12px}.mobile{display:none}.empty{padding:36px;color:var(--muted)}.crumb{font-size:11px;color:var(--muted);margin-bottom:7px}
@media(max-width:1100px){main{grid-template-columns:165px minmax(0,1fr) 300px}aside{padding:16px}.heading{padding:16px}}@media(max-width:780px){header{align-items:flex-start;padding:15px}header strong{font-size:17px}header small{display:block;margin:0}.status{padding:8px 15px}main{height:auto;grid-template-columns:1fr}nav{display:none}section{min-height:530px}aside{border-left:0;border-top:1px solid var(--line);min-height:240px}.mobile{display:block}h1{font-size:21px}}
</style>
<header><div><strong>Capability Map</strong><small>소스 → 의미 → 판단</small></div><div class="actions"><button id="packet">Astra 전달문</button><button id="export">전체 JSON</button></div></header><div class="status" id="status"></div><main><nav id="nav"></nav><section><div class="heading"><div class="crumb" id="crumb"></div><h1 id="title"></h1><p class="summary" id="summary"></p><div class="controls"><select id="mobile" class="mobile" aria-label="영역 선택"></select><input class="search" id="search" placeholder="기능·규칙 검색" aria-label="기능과 규칙 검색"><button id="up">상위 지도</button><button id="impact">영향 후보</button><button id="zoomout" aria-label="축소">−</button><button id="zoomin" aria-label="확대">+</button></div></div><div class="canvas" id="canvas"></div><div class="legend">실선: 정보·의존 / 점선: 제어·상태 · 노드 선택: 상세 · 하위 기능 버튼: 확대 · 연결선 선택: 조건</div></section><aside id="detail"></aside></main>
<script id="map-data" type="application/json">__MAP_JSON__</script><script>
'use strict';
const M=JSON.parse(document.getElementById('map-data').textContent), $=id=>document.getElementById(id), esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nodes=new Map(M.nodes.map(n=>[n.id,n]));let scope='',selected='',impact=false,zoom=1;
const children=id=>M.nodes.filter(n=>n.parent===id), rules=id=>M.rules.filter(r=>r.node===id);
function buttons(){let roots=children('');$('nav').innerHTML='<h3>WORKSPACE</h3><button data-scope="">전체 시스템</button>'+roots.map(n=>'<button data-scope="'+n.id+'">'+esc(n.label)+'</button>').join('')+'<p>소스 정적 해석<br>실행·Live 미검증<br>코드 열람 기능 없음</p><p>'+M.coverage.reviewed_files+' / '+M.coverage.available_files+' 파일 검토<br>파일 수는 분기 검토율이 아닙니다.</p>';$('nav').querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>navigate(b.dataset.scope));$('mobile').innerHTML='<option value="">전체 시스템</option>'+roots.map(n=>'<option value="'+n.id+'">'+esc(n.label)+'</option>').join('');}
function navigate(id){scope=children(id).length?id:(nodes.get(id)?.parent||'');selected=id;zoom=1;draw();detail(id);}
function reach(id){const seen=new Set([id]),queue=[id];while(queue.length){let x=queue.shift();M.relations.filter(e=>e.from===x).forEach(e=>{if(!seen.has(e.to)){seen.add(e.to);queue.push(e.to)}})}return seen;}
function projected(id,visible){let seen=new Set();while(id&&!visible.has(id)&&!seen.has(id)){seen.add(id);id=nodes.get(id)?.parent||''}return visible.has(id)?id:null;}
function draw(){const q=$('search').value.trim().toLowerCase();let visible=q?M.nodes.filter(n=>(n.label+' '+n.purpose+' '+rules(n.id).map(r=>r.title+' '+r.text).join(' ')).toLowerCase().includes(q)):children(scope);let ids=new Set(visible.map(n=>n.id)),affected=impact&&selected?reach(selected):new Set();const cols=Math.max(1,Math.min(3,visible.length)),w=Math.max(740,cols*295+40),h=Math.max(320,Math.ceil(visible.length/cols)*170+80);let pos=new Map(visible.map((n,i)=>[n.id,{x:32+i%cols*295,y:38+Math.floor(i/cols)*170}]));let edges='';
M.relations.forEach(e=>{let a=projected(e.from,ids),b=projected(e.to,ids);if(!a||!b||a===b)return;let A=pos.get(a),B=pos.get(b),x=A.x+120,y=A.y+102,X=B.x+120,Y=B.y;let d='M'+x+','+y+' C'+x+','+(y+36)+' '+X+','+(Y-36)+' '+X+','+Y;edges+='<path class="edge" d="'+d+'" marker-end="url(#arrow)" '+(['state','control'].includes(e.kind)?'stroke-dasharray="5 4"':'')+'/><path class="hit" d="'+d+'" data-edge="'+e.id+'"><title>'+esc(e.label)+'</title></path>';});
let cards=visible.map(n=>{let p=pos.get(n.id),r=rules(n.id),sub=n.purpose.length>26?n.purpose.slice(0,26)+'…':n.purpose;return '<g tabindex="0" role="button" aria-label="'+esc(n.label)+'" class="node '+(n.id===selected?'selected ':'')+(affected.has(n.id)?'impact':'')+'" data-node="'+n.id+'" transform="translate('+p.x+','+p.y+')"><rect width="248" height="105" rx="10"/><text x="15" y="30">'+esc(n.label.length>22?n.label.slice(0,22)+'…':n.label)+'</text><text class="sub" x="15" y="54">'+esc(sub)+'</text><text class="sub" x="15" y="83">'+r.length+' 규칙 · '+children(n.id).length+' 하위 기능 · 정적 해석</text><title>'+esc(n.label+' — '+n.purpose)+'</title></g>';}).join('');
$('canvas').innerHTML=visible.length?'<svg width="'+w*zoom+'" height="'+h*zoom+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="기능 지도"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="#6c8ba7"/></marker></defs>'+edges+cards+'</svg>':'<div class="empty">검색 결과가 없습니다.</div>';
$('canvas').querySelectorAll('[data-node]').forEach(b=>{b.onclick=()=>{selected=b.dataset.node;draw();detail(selected)};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();b.onclick()}}});$('canvas').querySelectorAll('[data-edge]').forEach(b=>b.onclick=()=>edgeDetail(b.dataset.edge));$('title').textContent=nodes.get(scope)?.label||M.title;$('summary').textContent=nodes.get(scope)?.purpose||M.summary;$('crumb').textContent=q?'전체 기능 검색':'전체 시스템'+(scope?' / '+nodes.get(scope).label:'');$('up').disabled=!scope;$('mobile').value=scope;$('impact').classList.toggle('active',impact);$('nav').querySelectorAll('[data-scope]').forEach(b=>b.classList.toggle('active',b.dataset.scope===scope));}
function list(title,values){return '<h3>'+title+'</h3>'+(values.length?values.map(v=>'<div class="detail">'+esc(v)+'</div>').join(''):'<div class="muted">명시된 항목 없음</div>');}
function detail(id){let n=nodes.get(id);if(!n){$('detail').innerHTML='<span class="badge">소스 기반 · 실행 미검증</span><h2>시스템 이해하기</h2><p class="detail">기능을 선택하면 동작·규칙·상태·미확인 영역을 확인할 수 있습니다. 지도는 코드 해석이며, 구현의 정확성이나 실제 운영을 보증하지 않습니다.</p>'+list('전체 한계',M.limitations)+list('미확인 사항',M.unknowns);return;}
$('detail').innerHTML='<span class="badge">정적 해석 / 의도 승인 아님</span><h2>'+esc(n.label)+'</h2><p class="detail">'+esc(n.purpose)+'</p>'+(children(id).length?'<button id="drill">하위 기능 '+children(id).length+'개 열기</button>':'')+list('입력',n.inputs)+list('출력',n.outputs)+list('기억하는 상태',n.state)+'<h3>동작 규칙</h3>'+rules(id).map(r=>'<div class="rule"><strong>'+esc(r.title)+'</strong><p>'+esc(r.text)+'</p><small>근거 '+r.evidence.map(e=>esc(e)+' · '+esc(M.evidence.find(x=>x.id===e)?.kind)).join(', ')+'</small></div>').join('')+list('미확인',n.unknowns)+'<h3>연결</h3>'+M.relations.filter(e=>e.from===id||e.to===id).map(e=>'<button style="margin:4px 0;width:100%;text-align:left" data-relation="'+e.id+'">'+esc(e.label)+'</button>').join('')+(impact?'<div class="unknown">강조는 그래프상 영향 후보입니다. 실제 오류 범위나 누락 없는 영향 분석은 아닙니다.</div>':'');if($('drill'))$('drill').onclick=()=>{scope=id;zoom=1;draw()};$('detail').querySelectorAll('[data-relation]').forEach(b=>b.onclick=()=>edgeDetail(b.dataset.relation));}
function edgeDetail(id){let e=M.relations.find(x=>x.id===id);$('detail').innerHTML='<span class="badge">'+esc(e.kind)+' · 정적 해석</span><h2>'+esc(e.label)+'</h2><p>'+esc(nodes.get(e.from).label)+' → '+esc(nodes.get(e.to).label)+'</p>'+list('적용 조건',[e.condition])+list('시점',[e.timing])+list('근거 ID',e.evidence)+'<div class="unknown">상위 지도에서는 하위 기능 간 연결이 부모 사이로 모여 보일 수 있습니다. 여기에 실제 연결 대상을 표시합니다.</div>';}
function download(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'application/json;charset=utf-8'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('export').onclick=()=>download('capability-map.json',JSON.stringify(M,null,2));$('packet').onclick=()=>{let ids=new Set(selected?[selected]:M.nodes.map(n=>n.id));if(selected)M.relations.filter(e=>e.from===selected||e.to===selected).forEach(e=>{ids.add(e.from);ids.add(e.to)});let packet={...M,nodes:M.nodes.filter(n=>ids.has(n.id)),rules:M.rules.filter(r=>ids.has(r.node)),relations:M.relations.filter(e=>ids.has(e.from)||ids.has(e.to)),omitted_nodes:M.nodes.filter(n=>!ids.has(n.id)).map(n=>({id:n.id,label:n.label})),scope_note:'Direct neighborhood only; outgoing boundary relations and omitted-node manifest retained. Global unknowns are not truncated.'};download('astra-packet.json',JSON.stringify(packet,null,2));};
$('search').oninput=()=>draw();$('mobile').onchange=e=>navigate(e.target.value);$('up').onclick=()=>{scope=nodes.get(scope)?.parent||'';zoom=1;draw();detail(scope)};$('impact').onclick=()=>{impact=!impact;draw();detail(selected)};$('zoomin').onclick=()=>{zoom=Math.min(2.4,zoom+.2);draw()};$('zoomout').onclick=()=>{zoom=Math.max(.6,zoom-.2);draw()};$('status').textContent='기준 '+M.commit.slice(0,12)+' · '+M.nodes.length+' 기능 · '+M.rules.length+' 규칙 · '+M.coverage.unreviewed_files+' 파일 미검토 · Live 미조회';buttons();draw();detail('');
</script></html>
